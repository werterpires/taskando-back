services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskando
      POSTGRES_USER: taskando
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskando_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskando_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskando -d taskando"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  taskando_pg:
